[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docgo"
version = "0.1.0"
license = "MIT"
authors = [
    { name = "Emmanuel Ebi-Fredrick", email = "ebifredrick07@gmail.com" }
]
description = "A token-efficient LLM-based Code documentation generator with deterministic code preservation."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
#    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "groq>=0.9.0",
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
docgo = "docgo.cli:app"

[project.urls]
"Homepage" = "https://github.com/Manuel-7tin/DocDocGo/blob/main/main.py"
